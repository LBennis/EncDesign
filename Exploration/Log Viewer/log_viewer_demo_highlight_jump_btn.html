
<style>
  .log-wrap { padding: 1rem 0; font-family: var(--font-sans); }
  .dialog { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); overflow: hidden; }
  .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .dialog-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; }
  .dialog-meta { font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 12px; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulse 1.5s ease-in-out infinite; }
  .pulse.done { background: var(--color-text-secondary); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .log-body { position: relative; }
  .log-scroll { height: 320px; overflow-y: auto; padding: 12px 16px; background: var(--color-background-secondary); font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--color-text-primary); }
  .log-scroll::-webkit-scrollbar { width: 6px; }
  .log-scroll::-webkit-scrollbar-track { background: transparent; }
  .log-scroll::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 3px; }
  .log-line { display: flex; gap: 10px; margin-bottom: 1px; }
  .log-line.new { animation: flashIn 0.6s ease-out; }
  @keyframes flashIn { 0%{background:#fef9c3;} 100%{background:transparent;} }
  .log-ts { color: var(--color-text-tertiary); white-space: nowrap; flex-shrink: 0; }
  .log-lvl { white-space: nowrap; flex-shrink: 0; font-weight: 500; min-width: 42px; }
  .lvl-INFO { color: #3b82f6; }
  .lvl-OK   { color: #22c55e; }
  .lvl-WARN { color: #f59e0b; }
  .lvl-ERR  { color: #ef4444; }
  .log-msg { color: var(--color-text-primary); }
  .follow-btn { position: absolute; bottom: 14px; right: 20px; display: flex; align-items: center; gap: 6px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--color-text-secondary); transition: opacity 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .follow-btn:hover { color: var(--color-text-primary); }
  .follow-btn.hidden { opacity: 0; pointer-events: none; }
  .dialog-footer { padding: 10px 16px; border-top: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: space-between; }
  .refresh-info { font-size: 11px; color: var(--color-text-tertiary); }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
  .badge-live { background: #dcfce7; color: #15803d; }
  .badge-done { background: var(--color-background-secondary); color: var(--color-text-secondary); }
</style>

<div class="log-wrap">
  <h2 class="sr-only">Interactive log viewer demo showing auto-scroll behaviour</h2>
  <div class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">
        <i class="ti ti-file-text" aria-hidden="true" style="font-size:16px;color:var(--color-text-secondary)"></i>
        Background process log
        <span class="badge badge-live" id="status-badge">● Live</span>
      </div>
      <div class="dialog-meta">
        <span id="line-count">0 lines</span>
      </div>
    </div>

    <div class="log-body">
      <div class="log-scroll" id="log-scroll"></div>
      <button class="follow-btn hidden" id="follow-btn" aria-label="Jump to bottom">
        <i class="ti ti-arrow-down" aria-hidden="true" style="font-size:13px"></i>
        Jump to bottom
      </button>
    </div>

    <div class="dialog-footer">
      <div class="refresh-info" id="refresh-info"><span class="pulse" id="pulse-dot"></span> refreshing every 5s</div>
    </div>
  </div>
  <p style="font-size:12px;color:var(--color-text-tertiary);margin-top:10px;text-align:center;">Try scrolling up — the log will keep refreshing without moving you. <strong>Jump to bottom</strong> re-enables auto-follow.</p>
</div>

<script>
(function() {
  const TOTAL_DURATION = 120000;
  const REFRESH_INTERVAL = 5000;

  const logScroll = document.getElementById('log-scroll');
  const followBtn = document.getElementById('follow-btn');
  const lineCountEl = document.getElementById('line-count');
  const statusBadge = document.getElementById('status-badge');
  const pulseDot = document.getElementById('pulse-dot');
  const refreshInfo = document.getElementById('refresh-info');

  const logTemplates = [
    ['INFO', 'Initialising task scheduler'],
    ['INFO', 'Loading configuration from /etc/app/config.yaml'],
    ['OK',   'Configuration loaded successfully'],
    ['INFO', 'Connecting to database at db.internal:5432'],
    ['OK',   'Database connection established (pool size: 10)'],
    ['INFO', 'Starting worker thread pool (8 threads)'],
    ['OK',   'Worker pool ready'],
    ['INFO', 'Scanning input directory /var/data/incoming'],
    ['INFO', 'Found 1,204 files to process'],
    ['INFO', 'Dispatching batch 1/48 to workers'],
    ['OK',   'Batch 1 completed — 25 files processed'],
    ['INFO', 'Dispatching batch 2/48'],
    ['WARN', 'File checksum mismatch on invoice_0034.pdf — retrying'],
    ['OK',   'Retry successful for invoice_0034.pdf'],
    ['INFO', 'Dispatching batch 3/48'],
    ['OK',   'Batch 3 completed — 25 files processed'],
    ['INFO', 'Writing intermediate results to /var/tmp/stage1.db'],
    ['OK',   'Stage 1 checkpoint saved'],
    ['INFO', 'Dispatching batch 4/48'],
    ['WARN', 'Worker thread 3 slow — queue depth 47'],
    ['INFO', 'Rebalancing task queue across remaining threads'],
    ['OK',   'Queue rebalanced — depth normalised'],
    ['INFO', 'Dispatching batch 5/48'],
    ['OK',   'Batch 5 completed'],
    ['INFO', 'Running data validation pass on stage 1 output'],
    ['OK',   'Validation passed — 0 errors'],
    ['INFO', 'Starting stage 2: transformation pipeline'],
    ['INFO', 'Applying schema migration v2.4 → v2.5'],
    ['OK',   'Schema migration complete'],
    ['INFO', 'Transforming records — 0% done'],
    ['INFO', 'Transforming records — 10% done'],
    ['INFO', 'Transforming records — 20% done'],
    ['OK',   'Stage 2 checkpoint saved at 20%'],
    ['INFO', 'Transforming records — 30% done'],
    ['WARN', 'Memory pressure detected — flushing cache'],
    ['INFO', 'Cache flushed — 214 MB reclaimed'],
    ['INFO', 'Transforming records — 40% done'],
    ['OK',   'Stage 2 checkpoint saved at 40%'],
    ['INFO', 'Transforming records — 50% done'],
    ['INFO', 'Dispatching enrichment lookups (external API)'],
    ['OK',   'Enrichment API responding — avg 42ms'],
    ['INFO', 'Transforming records — 60% done'],
    ['OK',   'Stage 2 checkpoint saved at 60%'],
    ['INFO', 'Transforming records — 70% done'],
    ['WARN', 'Rate limit warning from enrichment API — throttling'],
    ['INFO', 'Throttle delay: 2s between batches'],
    ['INFO', 'Transforming records — 80% done'],
    ['OK',   'Stage 2 checkpoint saved at 80%'],
    ['INFO', 'Transforming records — 90% done'],
    ['INFO', 'Transforming records — 100% done'],
    ['OK',   'Stage 2 complete'],
    ['INFO', 'Starting stage 3: output writing'],
    ['INFO', 'Opening output stream to s3://data-archive/2026/05/26/'],
    ['OK',   'S3 stream open'],
    ['INFO', 'Writing output file 1/6'],
    ['OK',   'Output file 1 written — 48.2 MB'],
    ['INFO', 'Writing output file 2/6'],
    ['OK',   'Output file 2 written — 51.7 MB'],
    ['INFO', 'Writing output file 3/6'],
    ['WARN', 'S3 write latency spike — 1,240ms'],
    ['OK',   'Latency normalised — continuing'],
    ['OK',   'Output file 3 written — 49.9 MB'],
    ['INFO', 'Writing output file 4/6'],
    ['OK',   'Output file 4 written — 52.1 MB'],
    ['INFO', 'Writing output file 5/6'],
    ['OK',   'Output file 5 written — 50.8 MB'],
    ['INFO', 'Writing output file 6/6'],
    ['OK',   'Output file 6 written — 47.3 MB'],
    ['INFO', 'Closing S3 stream and verifying checksums'],
    ['OK',   'All checksums verified'],
    ['INFO', 'Cleaning up temporary files in /var/tmp/'],
    ['OK',   'Temporary files removed'],
    ['INFO', 'Sending completion notification to ops@company.com'],
    ['OK',   'Notification sent'],
    ['OK',   'Process completed successfully — 1,204 files processed in 2m 0s'],
  ];

  let allLines = [];
  let startTime = Date.now();
  let isFinished = false;
  let nextLineIndex = 0;
  let refreshInterval;

  function formatTime(ms) {
    const d = new Date(ms);
    return d.toTimeString().slice(0, 8);
  }

  function isAtBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  }

  function appendLines(lines) {
    const shouldFollow = isAtBottom(logScroll);
    lines.forEach(line => {
      const el = document.createElement('div');
      el.className = 'log-line new';
      el.innerHTML = `<span class="log-ts">${line.ts}</span><span class="log-lvl lvl-${line.level}">${line.level}</span><span class="log-msg">${line.msg}</span>`;
      logScroll.appendChild(el);
    });
    lineCountEl.textContent = allLines.length + ' line' + (allLines.length !== 1 ? 's' : '');
    if (shouldFollow) {
      logScroll.scrollTop = logScroll.scrollHeight;
    }
    updateFollowBtn();
  }

  function updateFollowBtn() {
    if (isAtBottom(logScroll)) {
      followBtn.classList.add('hidden');
    } else {
      followBtn.classList.remove('hidden');
    }
  }

  function addNextLines() {
    if (isFinished) return;
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / TOTAL_DURATION, 1);
    const targetLineIndex = Math.floor(progress * logTemplates.length);
    const newBatch = [];
    while (nextLineIndex < targetLineIndex && nextLineIndex < logTemplates.length) {
      const [level, msg] = logTemplates[nextLineIndex];
      const line = { ts: formatTime(Date.now()), level, msg };
      allLines.push(line);
      newBatch.push(line);
      nextLineIndex++;
    }
    if (newBatch.length > 0) appendLines(newBatch);
    if (progress >= 1) finish();
  }

  function finish() {
    isFinished = true;
    clearInterval(refreshInterval);
    statusBadge.textContent = '✓ Done';
    statusBadge.className = 'badge badge-done';
    pulseDot.className = 'pulse done';
    refreshInfo.innerHTML = '<i class="ti ti-check" style="font-size:13px;vertical-align:-2px"></i> Process finished';
  }

  logScroll.addEventListener('scroll', updateFollowBtn);
  followBtn.addEventListener('click', () => {
    logScroll.scrollTop = logScroll.scrollHeight;
    followBtn.classList.add('hidden');
  });

  addNextLines();
  refreshInterval = setInterval(addNextLines, REFRESH_INTERVAL);
})();
</script>

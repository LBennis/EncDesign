<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A front-end prototype for a paired prompt and response chat interface.">
	<title>Encompaas AI Chat Concept</title>

	<link rel="stylesheet" href="../primitives.css">
	<link rel="stylesheet" href="../styles.css">
	<link rel="stylesheet" href="../component-styles.css">

	<style>
		:root {
			--chat-max-width: 1180px;
			--composer-max-width: 760px;
			--composer-height: 112px;
		}

		html {
			height: 100%;
			background: var(--bley-100);
		}

		body {
			min-height: 100%;
			margin: 0;
			background:
				radial-gradient(circle at center, var(--aqua-light-opaque-10), transparent 34rem),
				linear-gradient(180deg, var(--bley-50) 0%, var(--white) 72%);
			background-attachment: fixed;
			background-position: center;
		}

		button,
		textarea {
			transition: border-color var(--transition), box-shadow var(--transition), background var(--transition), font-size var(--transition);
		}

		.chat-shell {
			min-height: 100vh;
		}

		.conversation {
			width: min(var(--chat-max-width), calc(100% - var(--size-6)));
			margin: 0 auto;
			padding: var(--size-8) 0 calc(var(--composer-height) + var(--size-8));
		}

		.conversation:empty {
			display: none;
		}

		.turn {
			display: grid;
			grid-template-columns: minmax(220px, 0.32fr) minmax(0, 0.68fr);
			gap: clamp(var(--size-4), 5vw, var(--size-10));
			padding: var(--size-8) 0 var(--size-12);
			border-bottom: 1px solid var(--bley-400);
			animation: reveal-turn 420ms ease both;
		}

		.turn:first-child {
			padding-top: var(--size-4);
		}

		.turn:last-child {
			border-bottom: 0;
		}

		.prompt-column {
			align-self: start;
			position: sticky;
			top: var(--size-4);
			padding: var(--size-3);
			border: 1px solid var(--bley-400);
			border-radius: var(--radius-md);
			background: var(--bley-opaque-3);
		}

		.eyebrow {
			display: flex;
			align-items: center;
			gap: var(--size-1);
			margin-bottom: var(--size-2);
			color: var(--text-disabled);
			font-size: 0.75rem;
			font-weight: 600;
			text-transform: uppercase;
		}

		.prompt-text {
			color: var(--text-primary);
			font-size: 1.125rem;
			font-weight: 500;
			line-height: 1.5;
			overflow-wrap: anywhere;
		}

		.response-column {
			min-width: 0;
			color: var(--text-secondary);
		}

		.response-heading {
			display: flex;
			align-items: center;
			gap: var(--size-1);
			margin-bottom: var(--size-3);
			color: var(--primary);
			font-size: 0.875rem;
			font-weight: 600;
		}

		.ai-mark {
			display: grid;
			width: var(--size-3);
			height: var(--size-3);
			place-items: center;
			border: var(--aiBorder);
			border-radius: var(--radius-round);
			background: var(--aiGradientConical);
			color: var(--secondary);
		}

		.response-content {
			font-size: 1rem;
			line-height: 1.65;
		}

		.response-content p,
		.response-content ul {
			margin: 0 0 var(--size-3);
		}

		.response-content h2 {
			margin: var(--size-5) 0 var(--size-2);
			font-size: 1.125rem;
			font-weight: 600;
		}

		.response-content ul {
			padding-left: var(--size-3);
		}

		.response-content li {
			margin-bottom: var(--size-1);
			padding-left: var(--size-1);
		}

		.source-row {
			display: flex;
			flex-wrap: wrap;
			gap: var(--size-1);
			margin-top: var(--size-4);
		}

		.source-chip {
			padding: var(--size-0-5) var(--size-1);
			border: 1px solid var(--bley-400);
			border-radius: var(--radius-round);
			background: var(--white);
			color: var(--text-secondary);
			font-size: 0.75rem;
		}

		.composer-stage {
			position: fixed;
			top: 50%;
			left: 0;
			right: 0;
			z-index: 10;
			display: flex;
			justify-content: center;
			padding: var(--size-3);
			pointer-events: none;
			transform: translateY(-50%);
			transition: top 2s ease, transform 2s ease, background 2s ease;
		}

		.chat-shell.has-messages .composer-stage {
			top: 100%;
			padding: var(--size-2) var(--size-3) var(--size-3);
			background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.94) 32%);
			transform: translateY(-100%);
		}

		.composer {
			width: min(var(--composer-max-width), 100%);
			pointer-events: auto;
			transform: translateY(0);
			transition: width var(--transition-slow), transform var(--transition-slow);
		}

		.composer-label {
			display: block;
			margin: 0 0 var(--size-2) var(--size-1);
			color: var(--text-primary);
			font-size: 1.125rem;
			font-weight: 500;
			opacity: 1;
			transition: opacity 180ms ease, transform var(--transition-slow);
		}

		.chat-shell.has-messages .composer-label {
			position: absolute;
			opacity: 0;
			transform: translateY(var(--size-2));
			pointer-events: none;
		}

		.input-frame {
			display: flex;
			align-items: flex-end;
			gap: var(--size-1);
			padding: var(--size-1);
			border: 1px solid var(--bley-500);
			border-radius: var(--radius-lg);
			background: rgba(255, 255, 255, 0.96);
			box-shadow: var(--shadow-6);
		}

		.input-frame:focus-within {
			border-color: var(--primary);
			box-shadow: var(--shadow-8), 0 0 0 3px var(--aqua-opaque-10);
		}

		#prompt-input {
			width: 100%;
			min-height: 48px;
			max-height: 144px;
			padding: 12px var(--size-1);
			resize: none;
			overflow-y: auto;
			border: 0;
			outline: 0;
			background: transparent;
			color: var(--text-primary);
			font-size: 22px;
			line-height: 1.45;
		}

		#prompt-input::placeholder {
			color: var(--text-disabled);
		}

		.send-button {
			width: 44px;
			height: 44px;
			min-height: 44px;
			padding: 0;
			border-radius: var(--radius-round);
		}

		.send-button:disabled {
			background: var(--bley-400);
			cursor: default;
		}

		.send-button svg {
			width: 20px;
			height: 20px;
			fill: currentColor;
		}

		.composer-hint {
			margin-top: var(--size-1);
			color: var(--text-disabled);
			font-size: 0.75rem;
			text-align: center;
		}

		.chat-shell:not(.has-messages) .composer-hint {
			opacity: 0;
		}

		@keyframes reveal-turn {
			from { opacity: 0; transform: translateY(var(--size-3)); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 720px) {
			:root {
				--composer-height: 104px;
			}

			.conversation {
				width: calc(100% - var(--size-4));
				padding-top: var(--size-3);
			}

			.turn {
				grid-template-columns: 1fr;
				gap: var(--size-4);
				padding: var(--size-4) 0 var(--size-7);
			}

			.prompt-column {
				position: static;
			}

			.composer-stage,
			.chat-shell.has-messages .composer-stage {
				padding-inline: var(--size-2);
			}

			.composer-label {
				font-size: 1rem;
			}

			#prompt-input {
				max-height: 104px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				scroll-behavior: auto !important;
				transition-duration: 0.01ms !important;
				animation-duration: 0.01ms !important;
			}
		}
	</style>
</head>
<body>
	<main class="chat-shell" id="chat-shell">
		<section class="conversation" id="conversation" aria-live="polite" aria-label="Conversation"></section>

		<div class="composer-stage">
			<form class="composer" id="composer">
				<label class="composer-label" for="prompt-input">What can I help you find?</label>
				<div class="input-frame">
					<textarea id="prompt-input" rows="1" maxlength="600" placeholder="Ask about your information..." aria-describedby="composer-hint"></textarea>
					<button class="send-button" id="send-button" type="submit" aria-label="Send message" title="Send message" disabled>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M4.01 3.51a1 1 0 0 1 1.12-.2l15 8a1 1 0 0 1 0 1.76l-15 8A1 1 0 0 1 3.7 19.9L5.77 13H11a1 1 0 1 0 0-2H5.77L3.7 4.68a1 1 0 0 1 .31-1.17Z"/>
						</svg>
					</button>
				</div>
			
			</form>
		</div>
	</main>

	<template id="turn-template">
		<article class="turn">
			<aside class="prompt-column">
				<div class="eyebrow">Prompt</div>
				<p class="prompt-text"></p>
			</aside>
			<section class="response-column">
				<div class="response-heading"><span class="ai-mark">✦</span>Encompaas AI</div>
				<div class="response-content"></div>
			</section>
		</article>
	</template>

	<script>
		const responses = [
			{
				body: `
					<p>I found a focused set of material connected to your question. The strongest pattern is that teams get better results when governance is introduced as part of everyday work rather than treated as a separate compliance step.</p>
					<h2>What stands out</h2>
					<ul>
						<li>Clear ownership reduces duplicate review and shortens decision cycles.</li>
						<li>Shared classification rules make records easier to discover across repositories.</li>
						<li>Automated retention works best when exceptions remain visible and explainable.</li>
					</ul>
					<p>The most relevant documents are recent policy drafts, implementation notes, and two completed project reviews. Together they suggest beginning with one high-volume workflow and measuring retrieval time, review effort, and exception rates.</p>`,
				sources: ["Information governance", "Policy library", "Project reviews"]
			},
			{
				body: `
					<p>Across the available records, three recurring risks appear: inconsistent metadata, unclear disposition authority, and information being copied into unmanaged collaboration spaces.</p>
					<h2>Where to focus first</h2>
					<p>Start with active project records that are shared across several teams or stored in more than one system. These collections create the greatest immediate exposure because ownership becomes difficult to establish and staff cannot easily tell which copy is authoritative. Prioritise records containing customer, employee, financial, or contractual information, particularly where access has accumulated over time.</p>
					<ul>
						<li>Review collections without a named business owner or an agreed retention category.</li>
						<li>Identify duplicate material held in email, collaboration spaces, and formal repositories.</li>
						<li>Check whether inherited permissions still reflect current teams and responsibilities.</li>
						<li>Flag records affected by an investigation, legal hold, or regional policy exception.</li>
					</ul>
					<h2>Suggested next step</h2>
					<p>Run a short discovery exercise with legal, records, and operations. Map where the information begins, which decisions alter its status, and where an authoritative copy should live. This gives the team a practical control model without redesigning the entire process.</p>
					<p>For each priority collection, sample a manageable group of records and compare the metadata, permissions, duplication rate, and retention status against the agreed policy. Record exceptions separately from general quality issues so urgent legal or privacy concerns are not hidden inside a larger clean-up backlog.</p>
					<h2>How to measure progress</h2>
					<p>A lightweight dashboard can track items without an owner, overdue reviews, policy exceptions, and content approaching a retention event. Add measures for duplicate reduction, successful retrieval, and the time required to confirm an authoritative record. Reviewing these measures monthly will show whether controls are improving daily work rather than simply moving risk between systems.</p>
					<p>The first review should produce a ranked remediation list, a confirmed owner for each collection, and a small set of decisions that can be applied consistently to similar content elsewhere.</p>`,
				sources: ["Risk register", "Records schedule", "Operations handbook"]
			},
			{
				body: `
					<p>The evidence supports a phased approach rather than a single migration event. Start with content that has clear business value and a known owner, then use those results to refine classification and quality rules.</p>
					<h2>A practical sequence</h2>
					<ul>
						<li>Profile the source collection and identify sensitive or redundant material.</li>
						<li>Agree on destination metadata before moving any records.</li>
						<li>Pilot with a representative sample and validate search quality with real users.</li>
						<li>Move content in controlled batches with reconciliation reports.</li>
					</ul>
					<p>This sequence makes progress visible while preserving enough evidence to investigate omissions or unexpected changes.</p>`,
				sources: ["Migration playbook", "Content inventory", "Quality report"]
			},
			{
				body: `
					<p>A concise executive summary should separate the decision from the supporting detail. Lead with the outcome, name the material risk, and state what approval or action is needed.</p>
					<h2>Recommended structure</h2>
					<p>Use a one-sentence recommendation, three evidence points, and a short implementation note covering owner, timing, and dependencies. Supporting records can remain linked beneath the summary so the primary answer stays easy to scan.</p>
					<p>For this topic, the available evidence is consistent enough to make a recommendation, though the regional policy exception should be confirmed before rollout.</p>`,
				sources: ["Executive brief", "Regional policy", "Decision log"]
			}
		];

		const chatShell = document.querySelector('#chat-shell');
		const conversation = document.querySelector('#conversation');
		const composer = document.querySelector('#composer');
		const promptInput = document.querySelector('#prompt-input');
		const sendButton = document.querySelector('#send-button');
		const turnTemplate = document.querySelector('#turn-template');
		let responseIndex = 0;

		function updateComposer() {
			const length = promptInput.value.length;
			promptInput.style.fontSize = length < 50 ? '22px' : length < 100 ? '20px' : length < 150 ? '18px' : '16px';
			promptInput.style.height = 'auto';
			promptInput.style.height = `${Math.min(promptInput.scrollHeight, 144)}px`;
			sendButton.disabled = promptInput.value.trim().length === 0;
		}

		function addTurn(prompt) {
			const response = responses[responseIndex % responses.length];
			const fragment = turnTemplate.content.cloneNode(true);
			const turn = fragment.querySelector('.turn');
			fragment.querySelector('.prompt-text').textContent = prompt;
			fragment.querySelector('.response-content').innerHTML = response.body;

			const sourceRow = document.createElement('div');
			sourceRow.className = 'source-row';
			response.sources.forEach((source) => {
				const chip = document.createElement('span');
				chip.className = 'source-chip';
				chip.textContent = source;
				sourceRow.append(chip);
			});
			fragment.querySelector('.response-column').append(sourceRow);

			conversation.append(fragment);
			chatShell.classList.add('has-messages');
			responseIndex += 1;

			requestAnimationFrame(() => {
				turn.scrollIntoView({ behavior: 'smooth', block: 'start' });
			});
		}

		composer.addEventListener('submit', (event) => {
			event.preventDefault();
			const prompt = promptInput.value.trim();
			if (!prompt) return;

			addTurn(prompt);
			promptInput.value = '';
			updateComposer();
			promptInput.focus({ preventScroll: true });
		});

		promptInput.addEventListener('input', updateComposer);
		promptInput.addEventListener('keydown', (event) => {
			if (event.key === 'Enter' && !event.shiftKey) {
				event.preventDefault();
				composer.requestSubmit();
			}
		});

		updateComposer();
	</script>
</body>
</html>
